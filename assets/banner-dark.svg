<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 284" width="860" height="284" role="img" aria-labelledby="t d">
<title id="t">Jonathan Naal</title>
<desc id="d">Applied AI, Product, Engineering. EPF Paris, class of 2026. Open to roles, available now.</desc>
<style>
.ink{fill:#F0F3F6}.ink2{fill:#D1D7E0}.mut{fill:#9198A1}.acc{fill:#3FD5A3}
.rule{stroke:#30363D}.rail{stroke:#3D444D}.dot{stroke:#768390}.sacc{stroke:#3FD5A3}.sink{stroke:#D1D7E0}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype','Noto Serif','Times New Roman',serif}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,'Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace}
.halo{animation:breathe 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{0%,100%{opacity:.12;transform:scale(.55)}50%{opacity:.42;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.halo{animation:none;opacity:.25}}
.c{display:none}
@media (max-width:520px){.w{display:none}.c{display:inline}}
</style>
<g class="w">
