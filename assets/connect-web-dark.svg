<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 104" width="410" height="104" role="img" aria-labelledby="t d">
<title id="t">Website</title>
<desc id="d">Website: build in progress</desc>
<style>
.ink{fill:#F0F3F6}.ink2{fill:#D3DCEA}.mut{fill:#93A1B5}.acc{fill:#6B8AFF}
.rule{stroke:#2A3950}.rail{stroke:#34466A}.dot{stroke:#7C8CA8}.sacc{stroke:#6B8AFF}.sink{stroke:#D3DCEA}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype','Noto Serif','Times New Roman',serif}
