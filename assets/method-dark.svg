<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" width="860" height="190" role="img" aria-labelledby="t d">
<title id="t">How I think and work</title>
<desc id="d">01 Systems thinking: map the full workflow. 02 Customer-first: users shape the draft. 03 Ship and iterate: build, test, improve, looping back to users; or stop, and write down why. 04 Ownership: stay until it's adopted.</desc>
<style>
.ink{fill:#F0F3F6}.ink2{fill:#D3DCEA}.mut{fill:#93A1B5}.acc{fill:#6B8AFF}
.rule{stroke:#2A3950}.rail{stroke:#34466A}.dot{stroke:#7C8CA8}.sacc{stroke:#6B8AFF}.sink{stroke:#D3DCEA}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype','Noto Serif','Times New Roman',serif}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,'Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace}
.c{display:none}
@media (max-width:520px){.w{display:none}.c{display:inline}}
.flow{stroke-dasharray:4 5;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
